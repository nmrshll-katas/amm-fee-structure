[package]
name = "optimizer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
num_cpus = "1.17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
toasty = { version = "0.7.0", features = ["serde", "turso", "default"] }
libsql = "0.10.0-pre.4"
tokio = { version = "1", features = ["full"] }
rand = { version = "^0.10" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
