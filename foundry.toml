[profile.default]
src = "contracts/src"
out = ".cache/out"
libs = ["contracts/lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# EVM version for compatibility
evm_version = "paris"

# Compilation cache
cache = true
cache_path = ".cache/foundry"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"

auto_detect_remappings = true
remappings = [
    "forge-std/=contracts/lib/forge-std/src/"
]
